<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TFHS Bill / Voucher / Master Roll Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#666;font-family:"Times New Roman","Hind Siliguri",serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{background:#f2f2f2;padding:10px;text-align:center;font:14px Arial,"Hind Siliguri",sans-serif}
.bar select,.bar button{padding:7px 10px;margin:3px;font-size:14px;font-family:inherit;cursor:pointer}
.bar button{font-weight:bold}
.sheet{background:#fff;margin:10px auto;display:grid;overflow:hidden}
.sheet.p{width:210mm;height:297mm;grid-template-rows:1fr auto 1fr;padding:6mm}
.sheet.l{width:297mm;height:210mm;grid-template-columns:repeat(3,1fr);padding:5mm;gap:4mm}
.cut{text-align:center;font:bold 8pt Arial;border-top:.3mm dashed #555;margin:2mm 0;padding-top:.8mm;letter-spacing:1px}
.v{background:var(--bg);border:.35mm solid var(--c);padding:3mm;display:flex;flex-direction:column;overflow:hidden;font-size:9pt;--rh:9.5mm}
.p .v{--rh:8mm}
.mob{text-align:right;font-weight:bold;font-size:10pt}
.ti{text-align:center;font:900 14pt/1.1 Arial,"Hind Siliguri",sans-serif;margin-top:1mm}
.su{text-align:center;font-weight:bold;font-size:10pt;margin-top:1mm}
.tg{text-align:center;font-size:8.5pt;font-style:italic;margin:1mm 0}
.tg.pill{border:.4mm solid #000;border-radius:5mm;padding:1mm;font-style:normal;font-weight:bold;font-size:10pt;margin:2mm 3mm}
.pr{text-align:center;font-weight:bold;font-size:9.5pt;margin-bottom:1mm}
.info{border-top:.3mm solid var(--c);padding-top:1mm;margin-top:1mm}
.row{display:flex;gap:3mm;align-items:flex-end;min-height:7mm}
.row div{display:flex;flex:1;align-items:flex-end}
.row span{white-space:nowrap}
.row i{flex:1;border-bottom:.25mm dashed #777;height:5mm;margin-left:1mm}
table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:2mm;font-size:8.7pt}
th,td{border:.25mm dashed #777;padding:.8mm;text-align:center}
th{height:9mm;font-style:italic;line-height:1.05}
th{background:var(--th);color:var(--thc)}
.sd th,.sd td{border-style:solid;border-color:#333}
.strip{display:flex;justify-content:space-between;background:var(--st);font:bold 8pt Arial;padding:1mm 1.5mm;margin-top:1.5mm}
.bx{text-align:center;background:#e4e4e4;border:.3mm solid #444;font:bold 12pt Arial;letter-spacing:2px;padding:1mm;margin:1.5mm 0}
.tot{background:var(--st)}
td{height:var(--rh)}
.ln{height:var(--rh);border-bottom:.25mm dashed #777}
.tot{display:grid;grid-template-columns:1fr 22%;border-top:.25mm solid #000;border-bottom:.25mm dashed #777;min-height:8mm;align-items:center;font-weight:bold;font-style:italic;font-size:10pt;margin-top:1mm}
.tot b{text-align:right;padding-right:2mm}.tot u{border-left:.25mm dashed #777;height:8mm}
.ft{margin-top:2mm;padding-top:1.3mm;border-top:.25mm solid #000;font-size:8pt;line-height:1.4}
.ft .r{text-align:right;font-weight:bold;padding-right:2mm;margin-top:1.5mm}
.paid{display:inline-block;border:.5mm solid green;color:green;font:bold 10pt Arial;padding:.5mm 2mm;transform:rotate(-8deg);border-radius:1mm}
/* master roll */
.mr{width:297mm;height:210mm;padding:10mm 15mm;margin:10px auto;background:#fff;font-family:'Hind Siliguri',Arial,sans-serif;display:flex;flex-direction:column;justify-content:space-between}
.mr h3,.mr h4{margin:1px 0;text-align:center}.mr h3{font-size:16px}.mr h4{font-size:13px}
.mr .meta{display:flex;justify-content:space-between;font-size:12px;margin:6px 0}
.mr .meta div{width:48%}.mr .meta p{margin:3px 0;display:flex}.mr .meta i{flex:1;border-bottom:1px dotted #000;margin-left:5px}
.mr table{font-size:11px;margin:0 0 6px}.mr th,.mr td{border:1px solid #000;font-style:normal;padding:2px 4px}.mr th{background:#f0f0f0;height:auto}.mr td{height:6.2mm}
.mr .sg{display:flex;justify-content:space-around;font-size:10px;text-align:center;margin-top:5px}
@media print{body{background:none}.bar{display:none}.sheet,.mr{margin:0}}
</style></head><body>
<div class="bar">
  <select id="doc" onchange="go()"></select>
  <select id="lay" onchange="go()">
    <option value="p">2-in-1 · A4 Portrait (cut line)</option>
    <option value="l">3-in-1 · A4 Landscape</option>
  </select>
  <select id="ssm" onchange="go()">
    <option value="1">সর্বশিক্ষা মিশন সহ (With SSM)</option>
    <option value="0">সর্বশিক্ষা মিশন ছাড়া (Without SSM)</option>
  </select>
  <button onclick="window.print()">PRINT</button>
</div>
<div id="out"></div>
<script>
const G=[['Sl',9],['Particulars of goods',53],['Qty',11],['Rate',13],['Amt<br>(Rs.)',14]];
const rcv='<div><b>Received With Thanks Rs.</b> ____________________</div>';
const A=n=>`${rcv}<div>Date: ______________</div><div>Received Rs. with thanks on behalf of <b>${n}</b></div><div class="r">Authorised Signatory</div><div class="r" style="font-size:7pt">STAMP / SEAL</div>`;
const B=`${rcv}<div>Date: ____________ &nbsp; Signature: ____________</div><div class="r">SIGNATURE OF AUTHORITY</div>`;
const khan={bg:'#f5f9fd',c:'#1f3a6e',th:'#2a68b0',thc:'#fff',st:'#e3ebf5',sr:'Date: ........',mob:'Mob: 9833744930',t:'KHAN BROTHERS',s:['TALDANGRA :: BANKURA'],tag:'[Grocery Shop and Order Suppliers]',p:'Prop:- Nanigopal Khan &amp; Tribhanga Khan',r:[['Customer Name &amp; Address :'],['']],cols:G,foot:B};
const D={
 mondal:{mob:'Mob No: 9851761543',t:'MONDAL ELECTRIC',s:['TALDANGRA :: BANKURA'],tag:'(All Kinds of Electrical Goods Are Sold Here)',p:'Prop:- Aditya Mandal',r:[['Date:'],['Customer Name &amp; Address:'],['']],cols:G,foot:A('MONDAL ELECTRIC')},
 sabitri:{mob:'Mob: 9732268025',t:'SABITRI HARDWARE STORES',s:['Prop:- Ghosh Brothers','TALDANGRA * BANKURA'],r:[['Memo No:','Date:'],['Customer Name &amp; Address:'],['']],cols:G,foot:A('SABITRI HARDWARE STORES')},
 mamansa:{mob:'Mob: 9641931937',t:'MAMANSA KRISHI BHANDAR',s:['Prop:- RANJIT GHOSH','TALDANGRA * BANKURA'],r:[['Memo No:','Date:'],['Customer Name &amp; Address:'],['']],cols:G,foot:A('MAMANSA KRISHI BHANDAR')},
 khan:khan,
 mandal:{bg:'#fff5f8',c:'#6b1f55',th:'#6b1f55',thc:'#fff',st:'#fbdde7',sr:'Date: ........',mob:'Mob No: 9732167450',t:'MANDAL XEROX',s:['TALDANGRA ** BANKURA'],tag:'[All type of Printing ,Cutting ,Binding done here]',p:'Prop:- Netai Mandal',r:[['Customer Name &amp; Address :'],['']],cols:[['Sl',9],['Particulars',45],['No of Copies',15],['Rate',14],['Amt (Rs.)',17]],foot:B},
 egg:{bg:'#fffaf0',c:'#1f2a44',th:'#e0e6ee',st:'#e0e6ee',sr:'Bill No:......... Date:.........',solid:0,mob:'Mob: 9153314042',t:'DHIREN EGG SHOP',s:['TALDANGRA :: BANKURA'],tag:'[Egg Shop &amp; Order Suppliers]',p:'Prop: Dhiren Ghosh',r:[['Customer Name &amp; Address :'],['']],cols:[['Sl',9],['Particulars of Goods',49],['Qty',12],['Rate',13],['Amount (Rs.)',17]],tot:'TOTAL:',foot:`${rcv}<div>Date: ______________</div><div class="r">Customer Signature</div>`},
 veg:{bg:'#fffaf0',c:'#1f2a44',th:'#e0e6ee',st:'#e0e6ee',sr:'Bill No:......... Date:.........',solid:0,mob:'Mob: 6295668045',t:'CHAKRABORTY VEGETABLE STORE',s:['TALDANGRA :: BANKURA'],tag:'[Vegetable Shop &amp; Order Suppliers]',p:'Prop: Subhadip Chakraborty',r:[['Customer Name &amp; Address :'],['']],cols:[['Sl',9],['Particulars of Goods',49],['Qty',12],['Rate',13],['Amount (Rs.)',17]],tot:'TOTAL:',foot:`${rcv}<div>Date: ______________</div><div class="r">Customer Signature</div>`},
 joy:{bg:'#fffac0',c:'#4a3b00',solid:1,nohead:1,notot:1,cols:[['',8],['',32],['',15],['',15],['',15],['',15]],sr:'Date: ........',mob:'Mob:7076542575',t:'JOY GURU SAW MILL',s:['ASNA * BANKURA'],tag:'[Timber Merchant and General Order Suppliers]',p:'Prop: Kishor Ghosh',r:[['Customer Name &amp; Address :']],foot:'<div><b><i>Received Rs. ____________ with thanks on behalf of</i></b></div><div style="font:bold 11pt Times;margin:2mm 0 6mm 5mm">JOY GURU SAW MILL</div><div style="border-top:.25mm dashed #000;width:45%"><i>Authorised Signatory</i></div>'},
 jadav:{c:'#8b0000',th:'#8b0000',thc:'#fff',t:'যাদব মিষ্টান্ন ভান্ডার',s:['প্রোঃ- অরিজিৎ ঘোষ','তালডাংরা (পাঁচমুড়া মোড়) বাঁকুড়া','মোবাইল: ৪১০১৩৬৮৫১৯ / ৬২৯৬৬৭০৪১৪'],tag:'যেকোন অনুষ্ঠানে অর্ডার মতো রাজভোগ, সন্দেশ, পনির, ঘি, ছানার পায়েস সরবরাহ করা হয়।',r:[['নং:','তারিখ:'],['ক্রেতার নাম:']],cols:[['ক্র. নং',12],['বিবরণ (Item)',60],['টাকা (Amt)',28]],sl:'১২৩৪৫৬৭৮',tot:'মোট (Total):',foot:'<div style="display:flex;justify-content:space-between;align-items:flex-end"><span class="paid">PAID</span><span style="border-top:.25mm solid #000;padding:0 8mm">স্বাক্ষর</span></div>'},
 barat:{t:'বরাট ব্রাদার্স',tag:'প্রসিদ্ধ ঝাড়াই মশলার দোকান।',pill:1,p:'প্রো:—তপন বরাট',s:['তালডাংরা ● বাঁকুড়া'],r:[['তারিখ']],foot:''},
 ta:{solid:1,th:'#eee',t:'TALDANGRA FULMATI HIGH SCHOOL [H.S.]',ts:'11pt',s:['TALDANGRA :: BANKURA'],box:'TA BILL',r:[['Name of the Claimant :'],['Designation :']],cols:[['Sl',9],['Particulars of TA Bill',55],['Rate',16],['Amt (Rs.)',20]],tot:'Total:',foot:`<div>Received Rupees ______________________________</div><div>Date: ____________ &nbsp; Signature: ____________</div><div>Amt of Rs. Paid from : Development / Vocational Fund.</div><div class="r" style="font-size:8pt">Headmaster / Administrator / President / Secretary</div>`}
};
const L=[['— Shop vouchers —'],['mondal','Mondal Electric'],['sabitri','Sabitri Hardware Stores'],['mamansa','Mamansa Krishi Bhandar'],['khan','Khan Brothers (Grocery)'],['mandal','Mandal Xerox'],['egg','Dhiren Egg Shop'],['veg','Chakraborty Vegetable Store'],['joy','Joy Guru Saw Mill'],['jadav','যাদব মিষ্টান্ন ভান্ডার'],['barat','বরাট ব্রাদার্স'],['— Mixed pages —'],['mix3','Mondal + Sabitri + Mamansa (3 different)'],['mix2','Egg + Vegetable (2 different)'],['— School forms —'],['ta','TA Bill (Taldangra Fulmati HS)'],['mr','শ্রমিকের মজুরী মাষ্টার রোল (Master Roll)']];
const MIX={mix3:['mondal','sabitri','mamansa'],mix2:['egg','veg']};
doc.innerHTML=L.map(x=>x.length==1?`<option disabled>${x[0]}</option>`:`<option value="${x[0]}">${x[1]}</option>`).join('');
doc.value='mondal';
function V(d,n){
 const c=d.c||'#000';
 let h=`<div class="v" style="--c:${c};--bg:${d.bg||'#fff'};--th:${d.th||'transparent'};--thc:${d.thc||'#000'};--st:${d.st||'transparent'}">`;
 if(d.mob)h+=`<div class="mob">${d.mob}</div>`;
 h+=`<div class="ti" style="color:${c};${d.ts?'font-size:'+d.ts:''}">${d.t}</div>`;
 (d.s||[]).forEach(x=>h+=`<div class="su">${x}</div>`);
 if(d.tag)h+=`<div class="tg${d.pill?' pill':''}">${d.tag}</div>`;
 if(d.box)h+=`<div class="bx">${d.box}</div>`;
 if(d.p)h+=d.sr?`<div class="strip"><span>${d.p}</span><span>${d.sr}</span></div>`:`<div class="pr">${d.p}</div>`;
 h+='<div class="info">'+d.r.map(r=>`<div class="row">${r.map(l=>`<div>${l?`<span>${l}</span>`:''}<i></i></div>`).join('')}</div>`).join('')+'</div>';
 if(d.cols){
  h+=`<table class="${d.solid?'sd':''}">`+(d.nohead?'':'<thead><tr>')+d.cols.map(k=>`<th style="width:${k[1]}%">${k[0]}</th>`).join('')+(d.nohead?'':'</tr></thead>')+'<tbody>';
  for(let i=0;i<n;i++)h+='<tr>'+d.cols.map((k,j)=>`<td>${j==0&&d.sl?[...d.sl][i]||'':''}</td>`).join('')+'</tr>';
  h+=`</tbody></table>${d.notot?'':`<div class="tot"><b>${d.tot||'Total:'}</b><u></u></div>`}`;
 }else for(let i=0;i<n+2;i++)h+='<div class="ln"></div>';
 return h+(d.foot?`<div class="ft">${d.foot}</div>`:'<div style="flex:1"></div>')+'</div>';
}
function mr(ssm){
 const rows=Array.from({length:10},(_,i)=>`<tr><td>${'১২৩৪৫৬৭৮৯'[i]||'১০'}</td>${'<td></td>'.repeat(8)}</tr>`).join('');
 const sg=ssm?['সংশ্লিষ্ট অবর সহ-বাস্তুকার','জেলা বাস্তুকার দ্বারা পরীক্ষিত<br>(শীলমোহর সহ স্বাক্ষর)','ভি.ইসি/ডলুইসি-র সম্পাদক/প্রধান শিক্ষক<br>(শীলমোহর সহ স্বাক্ষর)','ভি.ইসি/ডলুইসি-র সভাপতি/এম.সি-র সম্পাদক<br>(শীলমোহর সহ স্বাক্ষর)']:['প্রধান শিক্ষক / সম্পাদক<br>(শীলমোহর সহ স্বাক্ষর)','সভাপতি / সম্পাদক<br>(শীলমোহর সহ স্বাক্ষর)'];
 const W=[4,26,9,5,15,8,8,14,11],H=['ক্রমিক সংখ্যা','শ্রমিকের নাম, পিতা/স্বামীর নাম ও ঠিকানা','কাজের তারিখ','মোট দিন','কাজের বিবরণ','মজুরীর হার','মোট পাওনা','প্রাপ্তি অন্তে প্রাপকের স্বাক্ষর/টিপসই','টিপসই শনাক্তকারী'];
 const m=(a,b)=>`<p>${a}<i></i></p>`;
 return `<div class="mr"><div>${ssm?'<h4>সর্বশিক্ষা অভিযান</h4><h3>সর্বশিক্ষা মিশন, বাঁকুড়া (বাস্তু বিভাগ)</h3>':''}<h4>শ্রমিকের মজুরী প্রদানের মাষ্টার রোল</h4>
 <div class="meta"><div>${m('বিদ্যালয়ের নাম: তালডাংরা ফুলমতি উচ্চ বিদ্যালয় (উ.মা.)')}${m('কাজ আরম্ভের তারিখ:')}${m('মজুরী প্রদানের তারিখ:')}</div><div>${m('চক্রের নাম:')}${m('কাজ সমাপ্তির তারিখ:')}</div></div>
 <table><thead><tr>${H.map((h,i)=>`<th style="width:${W[i]}%">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
 <div style="width:55%;font-size:11px"><div style="font-weight:500;margin-bottom:4px">• মাষ্টার রোলে বর্ণিত শ্রমিকদের কাজের পরিমাণ সঠিক আছে।</div><b>এক নজরে</b>
 <table style="margin-top:2px"><thead><tr><th>শ্রমিকের ধরন</th><th>সংখ্যা</th><th>মোট প্রদেয় অর্থ</th></tr></thead><tbody>${['দক্ষ','অর্ধ দক্ষ','সাধারণ','মোট'].map(x=>`<tr><td style="text-align:left">${x}</td><td></td><td></td></tr>`).join('')}</tbody></table></div></div>
 <div><div style="font-size:11px;margin-bottom:8px">শ্রমিকগণ আমার সাক্ষাতে স্বাক্ষর করিয়া নিজ নিজ মজুরী বুঝিয়া পাইলেন।</div><div class="sg">${sg.map(x=>`<div>${x}</div>`).join('')}</div></div></div>`;
}
function go(){
 const k=doc.value,isMR=k=='mr',lay=lay_(),n=lay=='p'?5:8;
 lay_el.disabled=isMR;ssm.style.display=isMR?'':'none';
 let css=document.getElementById('pg')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'pg'}));
 css.textContent=`@page{size:A4 ${isMR||lay=='l'?'landscape':'portrait'};margin:0}`;
 if(isMR){out.innerHTML=mr(ssm.value=='1');return}
 const list=MIX[k]||[k],cnt=lay=='p'?2:3;
 let h=`<div class="sheet ${lay}">`;
 for(let i=0;i<cnt;i++){h+=V(D[list[i%list.length]],n);if(lay=='p'&&i==0)h+='<div class="cut">✂ SCISSORS CUT LINE</div>'}
 out.innerHTML=h+'</div>';
}
const lay_el=document.getElementById('lay');function lay_(){return lay_el.value}
go();
</script></body></html>
