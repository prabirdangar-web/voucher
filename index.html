 r.onload=()=>{restore();document.execCommand('insertHTML',false,'<span class="bxi" style="width:40mm;height:16mm;border:0"><img src="'+r.result+'"></span>&nbsp;');dirty=true;inp.value=''};
 r.readAsDataURL(f)}

go();
